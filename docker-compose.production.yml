services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexora
    volumes:
      - nexora_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nexora:${POSTGRES_PASSWORD}@db:5432/nexora?schema=public
      NEXORA_SESSION_SECRET: ${NEXORA_SESSION_SECRET}
      NEXORA_APP_NAME: NEXORA OS
      NEXORA_DEFAULT_LOCALE: en
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  nexora_prod_pgdata:
