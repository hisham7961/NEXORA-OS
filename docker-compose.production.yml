services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexora
    volumes:
      - nexora_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    pull_policy: build
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nexora:${POSTGRES_PASSWORD}@db:5432/nexora?schema=public
      NEXORA_SESSION_SECRET: ${NEXORA_SESSION_SECRET}
      NEXORA_APP_NAME: NEXORA OS
      NEXORA_DEFAULT_LOCALE: en
    # Apply pending migrations to the (healthy) database before serving, then start.
    # A fresh production DB would otherwise never be schema-migrated and the app
    # would fail on first query (audit finding PLAT-08). Deployment uses migrations,
    # never `prisma db push` (per CLAUDE.md). `exec` hands the container over to Next
    # so it (not the shell) receives SIGTERM; with `init: true` below that gives a
    # graceful shutdown on rollout instead of a SIGKILL of in-flight work (PLAT-09).
    command: ["sh", "-c", "npx prisma migrate deploy && exec node_modules/.bin/next start -p 3000"]
    # Docker-provided init (tini) as PID 1: forwards signals and reaps zombies (PLAT-09).
    init: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Liveness endpoint confirmed at /api/v1/health/live (audit PLAT-13). node is
      # always present in the image; curl/wget are not on the slim base.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/v1/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  nexora_prod_pgdata:
