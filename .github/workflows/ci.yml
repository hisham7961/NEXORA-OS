name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: typecheck · test · migrate · build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://nexora:nexora@localhost:5432/nexora_ci?schema=public"
      # CI-only secret (strong, not a production secret).
      NEXORA_SESSION_SECRET: "ci-only-strong-secret-0123456789abcdef0123456789abcdef"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Localization gate (EN/AR parity + hard-coded-string ratchet)
        # The parity test (tests/i18n-parity.test.ts) also runs under `npm run test`,
        # but is surfaced here as an explicit release gate (§6, §50): it fails on any
        # EN/AR structural key mismatch, empty value, or untranslated Arabic copy.
        # The detector then fails the build if the hard-coded user-facing English
        # string count rises above the recorded baseline — the count can only ratchet
        # down, never up, so no new un-localized UI can merge.
        run: |
          npx vitest run tests/i18n-parity.test.ts
          npm run i18n:scan

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build
